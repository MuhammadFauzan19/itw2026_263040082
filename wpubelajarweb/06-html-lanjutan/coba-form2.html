<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh INput Atribut, checkbox dan radio</title>
</head>
<body>
    <h1>Contoh Input Atribut, Checkbox dan Radio</h1>
    <form>
        <label for="nama">Nama:
        <input type="text" name="nama" id="nama" placeholder="Masukkan nama" autocomplete="off" autofocus required>
        </label>
        <br>
        <h3>Hobby:</h3>
        <label for="hobby1">Olahraga:
            <input type="checkbox" name="hobby1" value="olahraga" id="hobby1"> Olahraga
        </label>
        <br>
        <label for="hobby2">Menulis:
            <input type="checkbox" name="hobby2" value="menulis" id="hobby2"> Menulis
        </label>
        <br>
        <label for="hobby3">Bersepeda:
            <input type="checkbox" name="hobby3" value="bersepeda" id="hobby3"> Bersepeda
        </label>
        <br>
        <h3>Jenis Kelamin:</h3>
        <br>
        <label for="pria">
            <input type="radio" name="jenis_kelamin" value="laki-laki" id="pria"> Laki-laki
        </label>
        <br>
        <label for="wanita">
            <input type="radio" name="jenis_kelamin" value="perempuan" id="wanita"> Perempuan
        </label>
        <br>
        <button type="submit">Kirim</button>
     
    </form>
</body>
</html>
