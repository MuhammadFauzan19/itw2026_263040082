<!DOCTYPE html>
<html lang="id">

<style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #f8f8ff;
      text-align: center;
      background-color: #0F172A;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;

      text-decoration-color: #374460;

      font-size: 22px;

      word-spacing: 5px;
    }

    span {
      color: crimson;
      text-decoration: line-through;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151 151 151 / 70%);
      font-weight: normal;
    }
