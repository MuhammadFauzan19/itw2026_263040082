<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote Galau</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: rgb(61, 61, 61);
      text-align: center;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgb(100, 100, 100);
      text-shadow: 5px 5px 0 rgb(215, 215, 215);
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151, 151, 151);
      font-weight: normal;
    }
  </style>
</head>

<body>

  <h1>Doa</h1>

  <p class="quote">
     “Jika doa bukan sebuah permintaan, setidaknya itu adalah sebuah pengakuan atas kelemahan diri manusia dihadapan Tuhannya.”
  </p>

  <p class="credit">— Pidibaiq</p>

</body>

</html>
